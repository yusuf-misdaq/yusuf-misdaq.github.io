<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bio · yusuf misdaq</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Vazirmatn:wght@700&amp;display=swap">
<style>
html{background:#1E2B55}
/* shared page chrome: ground, header name box, rotating menu, lapis blocks, footer */
body{margin:0;background:#F4EBD6}
a{color:#1E2B55}a:hover{color:#2E4A8C}
.namebox{display:flex;align-items:center;justify-content:center;width:178px;height:64px;box-sizing:border-box;background:#D6B25E;color:#1E2B55;text-decoration:none;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:23px;line-height:.9;letter-spacing:-0.045em;border-radius:2px;text-align:center;text-transform:lowercase}
.namebox:hover{color:#1E2B55;background:#E3C47E}
.namebox:focus-visible{outline:2px solid #2E4A8C;outline-offset:3px}
.hdr{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:flex-start;justify-content:space-between;padding:28px 0 46px}
.namebox{display:flex;align-items:center;justify-content:center;width:178px;height:64px;box-sizing:border-box;background:#D6B25E;color:#1E2B55;text-decoration:none;font-size:23px;line-height:.9;border-radius:2px;text-align:center}
.namebox:hover{color:#1E2B55;background:#E3C47E}
.namebox:focus-visible{outline:2px solid #2E4A8C;outline-offset:3px}
.menu{display:grid;grid-template-columns:repeat(6,150px);gap:10px}
@media (max-width: 1240px){.menu{grid-template-columns:repeat(3,150px);row-gap:30px}}
@media (max-width: 560px){.menu{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}}
.mi{position:relative;display:block;width:150px;max-width:100%;height:64px;text-decoration:none}
@media (max-width: 560px){.mi{width:100%}}
.mi:focus-visible{outline:2px solid #2E4A8C;outline-offset:3px}
.mbox{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:0 10px;box-sizing:border-box;background:var(--ink);border-radius:2px;overflow:hidden}
.mi:hover .mbox{background:#25336A}
.mi[aria-current="page"] .mbox{box-shadow:inset 0 0 0 2px #E3C47E}
.poe{position:relative;z-index:1;font-family:Inter,Vazirmatn,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:16px;line-height:1.02;letter-spacing:-0.03em;color:#E3C47E;text-align:center;text-transform:lowercase}
@keyframes sw0{0%{opacity:0}50%{opacity:.5}100%{opacity:1}}
@keyframes sw1{0%{opacity:0}50%{opacity:.5}100%{opacity:1}}
.sw0{animation:sw0 .6s steps(3) both}.sw1{animation:sw1 .6s steps(3) both}
.gen{position:absolute;top:100%;left:50%;margin-top:6px;white-space:nowrap;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#7A5A1E;text-transform:lowercase;opacity:0;letter-spacing:-.6em;transform:translateX(-50%);transition:opacity .25s ease,letter-spacing .35s ease;pointer-events:none}
.mi:hover .gen,.mi:focus-visible .gen{opacity:1;letter-spacing:-0.07em}
@media (hover: none){.gen{opacity:1;letter-spacing:-0.07em}.menu{row-gap:30px}}
@media (prefers-reduced-motion: reduce){.sw0,.sw1{animation:none}.gen{transition:none}}
.lapis{position:relative;overflow:hidden;background:#1E2B55}
.fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.fk{position:absolute;display:block}
.above{position:relative;z-index:1}
.foot{margin-top:120px;padding:44px 44px 36px;color:#F4EBD6;display:flex;flex-direction:column;gap:30px}
.fcall{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:27px;letter-spacing:-0.03em;color:#D6B25E;text-transform:lowercase;text-align:center;margin:0}
.flinks{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-0.07em;text-transform:lowercase}
.flinks a{color:#E3C47E;text-underline-offset:4px}.flinks a:hover{color:#F4EBD6}
/* menu: on hover the box turns gold and shows its plain name inside (computers); phones keep the name underneath */
.mbox{transition:background-color .35s ease}
.mbox .fx{transition:opacity .35s ease}
.poe{transition:opacity .3s ease}
.real{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:0 10px;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:17px;line-height:1;letter-spacing:-0.04em;color:#1E2B55;text-transform:lowercase;text-align:center;opacity:0;transition:opacity .35s ease;z-index:2;pointer-events:none}
@media (hover: hover){
.gen{display:none}
.mi:hover .mbox,.mi:focus-visible .mbox{background:#D6B25E}
.mi:hover .mbox .fx,.mi:focus-visible .mbox .fx{opacity:0}
.mi:hover .poe,.mi:focus-visible .poe{opacity:0 !important}
.mi:hover .real,.mi:focus-visible .real{opacity:1}
}
@media (hover: none){.real{display:none}}

/* project pages: a magazine-like stack of blocks. widths: text (680), wide (1040), full bleed. */
:root{--ink:#1E2B55;--ground:#F4EBD6;--gold:#D6B25E;--gold2:#E3C47E;--ochre:#7A5A1E;--pink:#DDA0B4;--red:#9E2A22;--panel:#EFE4CB;--text:680px;--wide:1040px}
.page{--ink:#1E2B55;background:var(--ground);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;box-sizing:border-box;padding:0 32px;overflow-x:clip}
.page > .foot{margin-left:-32px;margin-right:-32px}
.wk{flex:1 0 auto;width:100%;max-width:1216px;margin:0 auto;padding-bottom:40px}

/* hero */
.wk-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end;padding:44px 44px 40px;border-radius:2px;color:var(--ground)}
.wk-hero.nocover{grid-template-columns:minmax(0,1fr)}
.wk-title{margin:0;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:clamp(48px,8.4vw,132px);line-height:.88;letter-spacing:-0.05em;text-transform:lowercase;text-wrap:balance;overflow-wrap:anywhere}
.wk-meta{margin:18px 0 0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:-0.07em;color:var(--gold2);text-transform:lowercase}
.wk-line{margin:12px 0 0;max-width:46ch;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:20px;line-height:1.45;text-transform:lowercase}
.wk-cover{width:min(360px,34vw);aspect-ratio:1;object-fit:cover;display:block;box-shadow:0 22px 34px -18px rgba(0,0,0,.55);transform:rotate(var(--tilt,1.2deg))}
.wk-back{display:inline-block;margin:22px 0 0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-0.07em;color:var(--ochre);text-transform:lowercase;text-underline-offset:4px}

/* block rhythm */
.blocks{display:flex;flex-direction:column;gap:64px;margin-top:64px}
.blocks > .tight{margin-top:-46px}
.w-text{width:100%;max-width:var(--text);margin:0 auto}
.w-wide{width:100%;max-width:var(--wide);margin:0 auto}
.w-full{width:100vw;margin-left:calc(50% - 50vw);margin-right:0}
figure{margin-top:0;margin-bottom:0}
.cap{margin:10px 0 0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-0.07em;color:var(--ochre);text-transform:lowercase}
.w-full .cap{padding:0 32px}

/* prose */
.prose{font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:19px;line-height:1.66;hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty}
.prose p{margin:0 0 1em}
.prose > :last-child{margin-bottom:0}
.prose h2,.prose h3{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-0.03em;text-transform:lowercase;text-wrap:balance;line-height:1.05;margin:1.4em 0 .5em}
.prose h2{font-size:34px}.prose h3{font-size:24px}
.prose a{color:var(--ink);text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:4px}
.prose a:hover{color:#2E4A8C}
.prose img{display:block;width:calc(100% + 120px);max-width:none;margin:1.4em -60px;height:auto}
.prose blockquote{margin:1.2em 0;padding-left:22px;border-left:3px solid var(--gold);font-style:italic}
.prose ul,.prose ol{padding-left:1.2em}
.dropcap > p:first-of-type::first-letter{float:left;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:5.2em;line-height:.8;margin:.06em .1em 0 -.02em;color:var(--ink)}

/* images */
.img img{display:block;width:100%;height:auto}
.img.band img{aspect-ratio:3/1;object-fit:cover}
@media (max-width:760px){.img.band img{aspect-ratio:2/1}}

/* text wrapping around an image */
.wrapfig{margin:6px 0 14px;width:46%}
.wrapfig.third{width:36%}
.wrapfig img{display:block;width:100%;height:auto}
.wrapfig.left{float:left;margin-right:30px;margin-left:-110px}
.wrapfig.right{float:right;margin-left:30px;margin-right:-110px}
.wrapbox::after{content:"";display:block;clear:both}
@media (max-width:1000px){.wrapfig.left{margin-left:0}.wrapfig.right{margin-right:0}}
@media (max-width:640px){.wrapfig,.wrapfig.third{float:none;width:100%;margin:0 0 18px}}

/* poster */
.poster{position:relative;overflow:hidden;border-radius:2px;padding:clamp(28px,4vw,52px) clamp(24px,4vw,48px)}
.poster .pt{position:relative;z-index:1;margin:0;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;letter-spacing:-0.05em;line-height:.9;text-transform:lowercase;text-align:justify;text-align-last:justify;overflow-wrap:anywhere}
.poster.huge .pt{font-size:clamp(56px,11vw,168px)}
.poster.large .pt{font-size:clamp(40px,7vw,104px)}
.poster.medium .pt{font-size:clamp(28px,4.4vw,64px)}
.poster.c-lapis,.poster.c-ink{background:var(--ink);color:var(--ground)}
.poster.c-pink{background:var(--pink);color:var(--ink)}
.poster.c-gold{background:var(--gold);color:var(--ink)}
.poster.c-red{background:var(--red);color:var(--ground)}
.poster.c-cream{background:var(--ground);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.poster.photo{color:var(--ground)}
.poster.photo::before{content:"";position:absolute;inset:0;background:var(--pimg) center/cover no-repeat;z-index:0}
.poster.photo::after{content:"";position:absolute;inset:0;background:rgba(14,20,48,.38);z-index:0}

/* split (two halves side by side) */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.half{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--panel);border-radius:3px;padding:44px 28px 36px;color:var(--ink);text-decoration:none}
.split.lapis-halves .half{background:var(--ink);color:var(--ground)}
.half img{width:100%;max-width:440px;aspect-ratio:1;object-fit:contain;display:block;margin-bottom:26px}
.half h3{margin:0;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:clamp(28px,3.4vw,46px);letter-spacing:-0.045em;line-height:.95;text-transform:lowercase;text-wrap:balance}
.half p{margin:10px 0 0;max-width:32ch;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:17px;line-height:1.45;text-transform:lowercase}
.half .go{margin-top:16px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:-0.07em;color:var(--ochre);text-transform:lowercase;text-decoration:underline;text-underline-offset:4px}
.split.lapis-halves .half .go{color:var(--gold2)}
a.half:hover h3{color:#2E4A8C}
.split.lapis-halves a.half:hover h3{color:var(--gold2)}
@media (max-width:760px){.split{grid-template-columns:1fr}}

/* quotes */
.q-quiet{position:relative;padding-left:64px}
.q-quiet::before{content:"\201C";position:absolute;left:0;top:-26px;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:120px;color:var(--gold);line-height:1}
.q-quiet p{margin:0;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-style:italic;font-size:clamp(24px,2.8vw,34px);line-height:1.35;text-wrap:balance}
.q-poster p{margin:0;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:clamp(36px,5.6vw,80px);letter-spacing:-0.05em;line-height:.92;text-transform:lowercase;text-align:justify;text-align-last:justify}
.q-by{margin:16px 0 0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:-0.07em;color:var(--ochre);text-transform:lowercase}
.q-quiet .q-by{padding-left:0}

/* poem */
.poem-b{text-align:center}
.poem-b h3{margin:0 0 18px;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-weight:600;font-size:18px;text-transform:lowercase;font-style:italic}
.poem-b pre{margin:0;white-space:pre-wrap;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:21px;line-height:1.7}

/* gallery */
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.strip img{height:min(440px,60vw);width:auto;flex:0 0 auto;scroll-snap-align:center;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}

/* video */
.vid{position:relative;aspect-ratio:16/9;background:var(--ink);overflow:hidden;border-radius:2px}
.vid button{all:unset;position:absolute;inset:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vid .poster-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .play{position:relative;width:84px;height:84px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--gold);display:flex;align-items:center;justify-content:center}
.vid button:hover .play,.vid button:focus-visible .play{background:#25336A;box-shadow:0 0 0 3px var(--gold2),0 0 30px rgba(214,178,94,.5)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.clip video{display:block;width:100%;height:auto}

/* audio */
.aud{display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--ground);border-radius:3px;padding:16px 20px}
.aud span{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:18px;letter-spacing:-0.03em;text-transform:lowercase;flex:0 1 auto}
.aud audio{flex:1 1 auto;min-width:0;height:40px}

/* links row */
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.links a{position:relative;overflow:hidden;display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:2px;background:var(--ink);color:var(--gold2);text-decoration:none;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:17px;letter-spacing:-0.03em;text-transform:lowercase}
.links a:hover{color:var(--ground)}

/* pinned image beside scrolling text */
.pinned{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.pinned.right .pin{order:2}
.pin{position:sticky;top:24px}
.pin img{display:block;width:100%;height:auto;max-height:86vh;object-fit:cover}
@media (max-width:760px){.pinned{grid-template-columns:1fr}.pin{position:static}.pinned.right .pin{order:0}}

/* dividers and credits */
.divider{display:flex;justify-content:center}
.lapisband{height:30px;position:relative;overflow:hidden;background:var(--ink)}
.credits pre{margin:0;white-space:pre-wrap;columns:2 260px;column-gap:40px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;line-height:1.7;letter-spacing:-0.05em;color:var(--ochre);text-transform:lowercase}

/* previous / next */
.wk-nav{display:flex;justify-content:space-between;gap:16px;margin-top:96px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:-0.07em;text-transform:lowercase}
.wk-nav a{color:var(--ink);text-underline-offset:4px;max-width:45%}
.wk-missing{margin:120px auto;text-align:center;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:22px;text-transform:lowercase}
@media (max-width:760px){.wk-hero{grid-template-columns:1fr;padding:32px 24px}.wk-cover{width:100%;max-width:420px;transform:none}.blocks{gap:48px;margin-top:48px}.prose img{width:100%;margin:1.2em 0}.page{padding:0 16px}.page > .foot{margin-left:-16px;margin-right:-16px}.w-full .cap{padding:0 16px}}

/* bio: the wheel of bio versions, and the chosen text beneath it */
.bio{flex:1 0 auto;width:100%;max-width:1216px;margin:0 auto;padding:30px 0 40px;display:flex;flex-direction:column;align-items:center}
.bhint{margin:0 0 30px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:-0.07em;color:var(--ochre);text-transform:lowercase}
.bwheel{position:relative;width:min(460px,86vw);aspect-ratio:1;flex:0 0 auto}
.bpoint{position:absolute;left:50%;top:-14px;width:0;height:0;margin-left:-12px;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--gold);z-index:3;filter:drop-shadow(0 2px 0 rgba(30,43,85,.35))}
.bdisc{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--gold) inset,0 26px 40px -24px rgba(30,43,85,.6);will-change:transform}
.bsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bsvg line{stroke:var(--gold);stroke-width:.45;opacity:.85}
.bwedge{fill:transparent;transition:fill .5s ease}
.bwedge.on{fill:rgba(214,178,94,.92)}
.bseg{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(calc(min(460px,86vw) * -0.32)) rotate(calc(-1 * var(--a)))}
.blab{all:unset;position:absolute;left:-64px;top:-34px;width:128px;height:68px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;border-radius:8px;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:18px;line-height:1.02;letter-spacing:-0.03em;color:var(--gold2);text-transform:lowercase;z-index:2;transition:color .4s ease}
.blab:hover{color:var(--ground)}
.blab.on{color:var(--ink)}
.blab:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.bhub{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px var(--ink),0 0 0 8px var(--gold);z-index:2;pointer-events:none}
.btext{width:100%;max-width:var(--text);margin-top:56px;animation:bfade .6s ease both}
.btext .prose{font-size:21px;line-height:1.62}
.bsoon{margin:0;text-align:center;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:19px;color:var(--ochre);text-transform:lowercase}
@keyframes bfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:640px){.blab{font-size:15px;left:-50px;width:100px}.bhub{width:44px;height:44px;margin:-22px 0 0 -22px}.btext .prose{font-size:19px}}
@media (prefers-reduced-motion: reduce){.btext{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family:sans-serif;padding:24px">this site needs javascript turned on.</p></noscript>
<script type="module" src="assets/js/bio.js"></script>
</body>
</html>
