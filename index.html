<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yusuf misdaq</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#F4EBD6}
a{color:#1E2B55}a:hover{color:#2E4A8C}
.lapis{position:relative;overflow:hidden;background:#1E2B55}
.fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.fk{position:absolute;display:block}
.above{position:relative;z-index:1}
.ph::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background-size:cover;background-repeat:no-repeat;background-position:var(--bp,50% 50%);z-index:0}
.ph::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(14,20,48,var(--dim,.3));z-index:0}
.ph-1::before{background-image:url(media/images/portrait-1.webp)}
.ph-2::before{background-image:url(media/images/portrait-2.webp)}
.ph-flip::before{transform:rotate(180deg)}
.ph-mx::before{transform:scaleX(-1)}
.ph-my::before{transform:scaleY(-1)}
.ph-zoom::before{background-size:var(--bs) auto}
.poemlink{text-decoration:none;color:#F4EBD6;transition:box-shadow .3s ease}
.poemlink::after{transition:background .3s ease}
.poemlink:hover,.poemlink:focus-visible{color:#F4EBD6;box-shadow:0 0 0 2px #D6B25E,0 0 30px rgba(214,178,94,.45)}
.poemlink:hover::after,.poemlink:focus-visible::after{background:rgba(14,20,48,.25)}
.poemlink:focus-visible{outline:none}
.fcall{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:27px;letter-spacing:-0.03em;color:#D6B25E;text-transform:lowercase;text-align:center;margin:0}
.foot{margin-top:120px;border-radius:0;padding:44px 44px 80px;color:#F4EBD6;display:flex;flex-direction:column;gap:30px}
.frow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px}
.flab{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.03em;color:#D6B25E;text-transform:lowercase;margin:0 0 12px}
.fform{display:flex;flex-wrap:wrap;gap:10px;max-width:460px}
.fld{flex:1 1 220px;min-width:0;min-height:44px;box-sizing:border-box;border:1.5px solid #E3C47E;background:transparent;color:#F4EBD6;border-radius:999px;padding:11px 18px;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:15px}
.fld::placeholder{color:rgba(244,235,214,.7)}
.fbtn{min-height:44px;border:none;border-radius:999px;padding:11px 22px;background:#D6B25E;color:#1E2B55;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:15px;cursor:pointer;text-transform:lowercase}
.flinks{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-0.07em;text-transform:lowercase}
.flinks a{color:#E3C47E;text-underline-offset:4px}.flinks a:hover{color:#F4EBD6}
.fsig{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-0.07em;color:#E3C47E;text-transform:lowercase}
.ph .fx{display:none}
.namelink{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:300px;padding:40px 24px;box-sizing:border-box;border-radius:0;width:100%}
.namelink:focus-visible{outline:2px solid #D6B25E;outline-offset:-6px}
.nm{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:clamp(56px,11vw,150px);line-height:.88;letter-spacing:-0.05em;color:#D6B25E;text-transform:lowercase;text-align:center;transition:color .3s ease}
.tag{display:block;margin-top:-2px;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-weight:400;font-size:clamp(14px,1.6vw,19px);line-height:1.2;color:#E3C47E;text-transform:lowercase;text-align:center}
.namelink:hover .nm,.namelink:focus-visible .nm{color:#EED39A}
.enter{display:block;margin-top:18px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-0.07em;color:#E3C47E;text-transform:lowercase;text-align:center;opacity:0;transition:opacity .3s ease}
.namelink:hover .enter,.namelink:focus-visible .enter{opacity:1}
@media (hover: none){.enter{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) rotate(var(--r))}to{opacity:1;transform:translateY(0) rotate(var(--r))}}
.stack{width:min(520px,100%);margin:64px auto 0;transform:rotate(var(--r));animation:drop .6s ease .3s both}
.eod{display:inline-block;margin:0 0 10px;padding:11px 18px 12px;border-radius:3px;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:20px;line-height:1;letter-spacing:-0.03em;color:#D6B25E;text-transform:lowercase}
.poem{display:block;width:100%;box-sizing:border-box;padding:30px 34px 28px;border-radius:3px;color:#F4EBD6}
.pt{font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-weight:400;font-style:italic;font-size:17px;line-height:1.6;text-transform:lowercase;margin:16px 0 0;text-align:right}
.pb{font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:17px;line-height:1.6;white-space:pre-wrap;margin:0}
.pm{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;margin-top:22px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-0.07em;color:#E3C47E;text-transform:lowercase}
.pm a{color:#E3C47E;text-underline-offset:4px}
.pm a:hover{color:#F4EBD6}
.sunwrap{position:relative}
.rays{position:absolute;top:50%;margin-top:-80px;overflow:visible;filter:url(#raypix)}
.rays-l{left:-124px}.rays-r{right:-124px}
.ray{stroke:#1E2B55;stroke-width:6;stroke-linecap:round;opacity:0;animation:flash 2s step-end infinite}
@keyframes flash{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
@media (max-width: 720px){.rays{display:none}}
@media (prefers-reduced-motion: reduce){.stack{animation:none}.ray{animation:none;opacity:1}}
.strip{position:fixed;left:0;right:0;bottom:0;z-index:50;height:44px;display:flex;align-items:center;background:var(--sbg);color:var(--sfg);box-shadow:0 -1px 0 var(--sline)}
.s-lapis{--sbg:#1E2B55;--sfg:#F4EBD6;--slab:#D6B25E;--sacc:#D6B25E;--sline:rgba(214,178,94,.35);--spill:#1E2B55}
.s-red{--sbg:#9E2A22;--sfg:#F4EBD6;--slab:#EED39A;--sacc:#EED39A;--sline:rgba(30,43,85,.5);--spill:#9E2A22}
.s-gold{--sbg:#D6B25E;--sfg:#1E2B55;--slab:#1E2B55;--sacc:#1E2B55;--sline:rgba(30,43,85,.45);--spill:#D6B25E}
.s-pink{--sbg:#DDA0B4;--sfg:#1E2B55;--slab:#1E2B55;--sacc:#1E2B55;--sline:rgba(30,43,85,.4);--spill:#DDA0B4;--sbar:#1E2B55}
.s-lapis,.s-red{--sbar:#D6B25E}.s-gold{--sbar:#1E2B55}
.s-gold .fx{display:none}
.s-red .fk{opacity:.55 !important}
.player{flex:0 0 auto;width:clamp(200px,14%,260px);border-right:3px solid var(--sbar);display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;box-sizing:border-box;height:100%}
.pp{flex:0 0 auto;width:32px;height:32px;border:1.5px solid var(--sacc);border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--sacc)}
.pp:hover,.pp:focus-visible{background:rgba(255,255,255,.12);outline:none}
.pp svg{display:block}
.pmeta{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:5px}
.song{display:block;width:100%;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent)}
.songin{display:inline-block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:-0.07em;color:var(--slab);text-transform:lowercase;line-height:1.1;will-change:transform}
.songin i{font-style:normal;padding:0 14px}
.songin b{font-weight:inherit}
.songin[data-short] .dup{display:none}
.song{max-width:110px}
.vol{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:0;background:transparent;cursor:pointer}
.vol::-webkit-slider-runnable-track{height:2px;background:var(--sacc);opacity:.8;border-radius:2px}
.vol::-moz-range-track{height:2px;background:var(--sacc);border-radius:2px}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;background:var(--sacc);border:none}
.vol::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--sacc);border:none}
.vol:focus-visible{outline:1px solid var(--sacc);outline-offset:2px}
.tick{flex:1 1 auto;min-width:0;height:100%;overflow:hidden;display:flex;align-items:center;cursor:default;-webkit-mask-image:linear-gradient(to right,transparent,#000 56px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to right,transparent,#000 56px,#000 calc(100% - 22px),transparent)}
.track{display:flex;flex:0 0 auto;width:max-content;will-change:transform}
.ti{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding-right:20px;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-0.03em}
.ti::after{content:"\2726";color:var(--sacc);font-size:10px;padding-left:11px}
.tl,.tt{display:block;line-height:1}
.tl{font-weight:800;font-size:13px;color:var(--slab)}
.tt{font-size:13px;color:var(--sfg)}
a.tt{text-decoration:underline;text-decoration-thickness:1.5px;text-decoration-color:var(--sacc);text-underline-offset:4px}
a.tt:hover,a.tt:focus-visible{opacity:.8;outline:none}
.tmoon .tl{font-size:15px;line-height:1}
.tday .tl{color:var(--spill);background:var(--slab);padding:3px 7px 4px;border-radius:2px}
@media (max-width: 720px){.player{width:auto;padding-right:6px;gap:8px}.pmeta{width:84px;flex:0 0 84px}.vol{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family:sans-serif;padding:24px">this site needs javascript turned on.</p></noscript>
<script type="module" src="assets/js/index.js"></script>
</body>
</html>
