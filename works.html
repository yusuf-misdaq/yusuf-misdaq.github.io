<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EBD6">
<title>selected works · yusuf misdaq</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Vazirmatn:wght@700&amp;display=swap">
<style>
body{margin:0;background:#F4EBD6}
a{color:#1E2B55}a:hover{color:#2E4A8C}
.at{font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;text-transform:lowercase}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;text-transform:lowercase;letter-spacing:-0.07em}
.det{color:#7A5A1E}
.inter{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:900;letter-spacing:-0.045em;text-transform:lowercase}
.pl{display:block;text-align:justify;text-align-last:justify;line-height:.9}
.pphoto{position:relative;overflow:hidden;min-height:460px;display:flex;align-items:flex-end;border-radius:1px}
.pimg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.ptext{position:relative;width:100%;box-sizing:border-box;padding:40px 38px 34px}
.ptitle{color:#F4EBD6;-webkit-text-stroke:2px #D6B25E;paint-order:stroke fill;text-shadow:0 3px 18px rgba(20,24,50,.45)}
.navlink{color:var(--ink);text-decoration:none;font-size:17px}
.navlink:hover{text-decoration:underline;text-underline-offset:4px}
.hdr{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:flex-start;justify-content:space-between;padding:28px 0 46px}
.namebox{display:flex;align-items:center;justify-content:center;width:178px;height:64px;box-sizing:border-box;background:#D6B25E;color:#1E2B55;text-decoration:none;font-size:23px;line-height:.9;border-radius:2px;text-align:center}
.namebox:hover{color:#1E2B55;background:#E3C47E}
.namebox:focus-visible{outline:2px solid #2E4A8C;outline-offset:3px}
.menu{display:grid;grid-template-columns:repeat(6,150px);gap:10px}
@media (max-width: 1240px){.menu{grid-template-columns:repeat(3,150px);row-gap:30px}}
@media (max-width: 560px){.menu{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}}
.mi{position:relative;display:block;width:150px;max-width:100%;height:64px;text-decoration:none}
@media (max-width: 560px){.mi{width:100%}}
.mi:focus-visible{outline:2px solid #2E4A8C;outline-offset:3px}
.mbox{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:0 10px;box-sizing:border-box;background:var(--ink);border-radius:2px;overflow:hidden}
.mi:hover .mbox{background:#25336A}
.mi[aria-current="page"] .mbox{box-shadow:inset 0 0 0 2px #E3C47E}
.poe{position:relative;z-index:1;font-family:Inter,Vazirmatn,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:16px;line-height:1.02;letter-spacing:-0.03em;color:#E3C47E;text-align:center;text-transform:lowercase}
@keyframes sw0{0%{opacity:0}50%{opacity:.5}100%{opacity:1}}
@keyframes sw1{0%{opacity:0}50%{opacity:.5}100%{opacity:1}}
.sw0{animation:sw0 .6s steps(3) both}.sw1{animation:sw1 .6s steps(3) both}
.gen{position:absolute;top:100%;left:50%;margin-top:6px;white-space:nowrap;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#7A5A1E;text-transform:lowercase;opacity:0;letter-spacing:-.6em;transform:translateX(-50%);transition:opacity .25s ease,letter-spacing .35s ease;pointer-events:none}
.mi:hover .gen,.mi:focus-visible .gen{opacity:1;letter-spacing:-0.07em}
@media (hover: none){.gen{opacity:1;letter-spacing:-0.07em}.menu{row-gap:30px}}
@media (prefers-reduced-motion: reduce){.sw0,.sw1{animation:none}.gen{transition:none}}
/* order mode: tidy column */
.tidy .peek,.tidy .gwrap{display:none}
.tidy .card{height:168px;overflow:hidden}
.tidy .ct,.tidy .cl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.v-crop{width:var(--sz,140px);height:var(--sz,140px);border-radius:50%;background:var(--bg);-webkit-mask:conic-gradient(from var(--cf,0deg),#000 0 var(--keep,100%),transparent 0);mask:conic-gradient(from var(--cf,0deg),#000 0 var(--keep,100%),transparent 0)}
.v-crop .lbl{display:none}
.v-crop.cov{background-color:#E9DDBE;background-repeat:no-repeat;background-position:var(--bpos);background-size:var(--bsize)}
.v-crop.cov{background-image:var(--cover)}

.lapis{position:relative;overflow:hidden;background:var(--ink)}
.fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.fk{position:absolute;display:block}
.above{position:relative;z-index:1}

/* text filter */
.flt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 22px;font-size:13px}
.tx{border:none;background:none;padding:12px 0;min-height:44px;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:lowercase;color:#7A5A1E;text-underline-offset:5px}
.tx:hover{color:var(--ink)}
.tx:focus-visible{outline:2px solid #2E4A8C;outline-offset:2px}
.tx-on{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px}
.sep{color:#7A5A1E;opacity:.6}

/* the totem */
.totem{position:relative;padding:56px 0 40px}
.slot{position:relative;display:block}
@keyframes drop{from{opacity:0;transform:translateY(-16px) rotate(var(--r))}to{opacity:1;transform:translateY(0) rotate(var(--r))}}
.card{position:relative;display:flex;flex-direction:column;gap:5px;width:340px;max-width:100%;box-sizing:border-box;padding:16px 18px 17px;border-radius:3px;background:var(--ink);color:#F4EBD6;text-decoration:none;transform:rotate(var(--r));animation:drop .5s ease both}
.card:hover,.card:focus-visible{color:#F4EBD6;z-index:5}
.card:focus-visible{outline:2px solid #2E4A8C;outline-offset:4px}
.ct{font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-weight:600;font-size:18px;line-height:1.2;text-transform:lowercase}
.cm{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#E3C47E;text-transform:lowercase;letter-spacing:-0.07em}
.cl{font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:14px;line-height:1.4;text-transform:lowercase;opacity:.9}
.card .fx{border-radius:3px}

/* the object that floats out on hover */
.peek{position:absolute;top:50%;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .25s ease}
.peek-r{left:calc(100% + 34px);transform:translate(-10px,-50%)}
.peek-l{right:calc(100% + 34px);transform:translate(10px,-50%)}
.card:hover .peek,.card:focus-visible .peek{opacity:1;transform:translate(0,-50%)}
@media (max-width: 760px){.peek{display:none}}
.thing{position:relative;display:block;box-shadow:0 18px 24px -14px rgba(30,43,85,.55)}
.lbl{position:relative;z-index:2;display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;line-height:1.3;color:#F4EBD6;text-transform:lowercase;letter-spacing:-0.05em}
.v-sleeve{width:188px;height:150px;box-shadow:none}
.v-sleeve::before{content:"";position:absolute;top:7px;left:50px;width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,#E9DDBE 0 8px,#141414 9px 20px,transparent 21px),repeating-radial-gradient(circle,#161616 0 1.5px,#272727 1.5px 3px)}
.v-sleeve::after{content:"";position:absolute;left:0;top:0;width:150px;height:150px;background:var(--tint);box-shadow:0 18px 24px -14px rgba(30,43,85,.55)}
.v-sleeve .lbl{position:absolute;left:12px;top:12px;width:122px}
.v-disc{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#F4EBD6 0 3px,var(--tint) 4px 28px,transparent 29px),repeating-radial-gradient(circle,#151515 0 1.5px,#272727 1.5px 3px)}
.v-cassette{width:176px;height:112px;border-radius:7px;background:var(--tint);padding:10px 12px;box-sizing:border-box}
.v-cassette::after{content:"";position:absolute;left:30px;right:30px;bottom:14px;height:34px;border-radius:17px;background:radial-gradient(circle at 25% 50%,#2a2a2a 0 9px,#F4EBD6 10px 12px,transparent 13px),radial-gradient(circle at 75% 50%,#2a2a2a 0 9px,#F4EBD6 10px 12px,transparent 13px),#3a3328}
.v-reel{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#c9c3b4 0 8px,#6d6a63 9px 14px,transparent 15px),radial-gradient(circle at 50% 24%,var(--ground) 0 17px,transparent 18px),radial-gradient(circle at 74% 62%,var(--ground) 0 17px,transparent 18px),radial-gradient(circle at 26% 62%,var(--ground) 0 17px,transparent 18px),radial-gradient(circle,#9a968c 0 70px,var(--tint) 71px 75px,transparent 75.5px)}
.v-canister{width:160px;height:160px;border-radius:50%;background:repeating-radial-gradient(circle,#a9a59b 0 2px,#bfbbb1 2px 5px)}
.v-canister::after{content:"";position:absolute;left:18px;right:18px;top:56px;height:48px;background:var(--tint)}
.v-canister .lbl{position:absolute;left:26px;right:26px;top:62px;text-align:center}
.v-book{width:118px;height:168px;background:var(--tint);border-radius:2px 6px 6px 2px;box-shadow:inset 9px 0 0 rgba(0,0,0,.2),0 18px 24px -14px rgba(30,43,85,.55);padding:16px 12px 12px 20px;box-sizing:border-box}
.v-book .lbl{font-size:12px}
.v-notebook.thing{display:inline;width:128px;height:168px;border-radius:3px;padding:20px 10px 10px 32px;box-sizing:border-box;background:linear-gradient(90deg,transparent 0 24px,rgba(181,96,58,.55) 24px 25px,transparent 25px),repeating-linear-gradient(180deg,#EBDDBC 0 17px,rgba(30,43,85,.2) 17px 18px)}
.v-notebook .lbl{color:var(--ink);font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;font-size:13px;letter-spacing:0}
.v-canvas{width:178px;height:134px;border:10px solid #5B4630;box-sizing:border-box;background:radial-gradient(ellipse at 30% 70%,var(--tint),transparent 62%),radial-gradient(ellipse at 76% 30%,#E7C27A,transparent 55%),#C9B48C}
.v-frame{width:134px;height:174px;border:12px solid #B08A3E;box-sizing:border-box;background:linear-gradient(170deg,var(--tint),#2E2A24);box-shadow:inset 0 0 0 3px #7E6127,0 18px 24px -14px rgba(30,43,85,.55)}
.v-clay{width:118px;height:152px;border-radius:48% 52% 44% 56% / 62% 58% 42% 38%;background:radial-gradient(ellipse at 35% 28%,#DDA27A,var(--tint) 58%,#5E3220)}
.v-vessel{width:132px;height:142px;border-radius:40% 40% 46% 46% / 30% 30% 70% 70%;background:radial-gradient(ellipse at 38% 32%,#E0AA80,var(--tint) 60%,#5E3220)}
.v-rug{width:196px;height:124px;background:repeating-linear-gradient(90deg,var(--tint) 0 14px,#E9DAB6 14px 18px,#1E2B55 18px 22px,#E9DAB6 22px 26px)}
.v-rug::before{content:"";position:absolute;left:-9px;right:-9px;top:0;bottom:0;background:repeating-linear-gradient(180deg,#E9DAB6 0 2px,transparent 2px 5px) left/9px 100% no-repeat,repeating-linear-gradient(180deg,#E9DAB6 0 2px,transparent 2px 5px) right/9px 100% no-repeat}
.v-rug::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;transform:rotate(45deg);background:var(--tint);border:3px solid #E9DAB6}
.v-cushion{width:138px;height:128px;border-radius:30px;background:radial-gradient(circle,rgba(0,0,0,.28) 0 5px,transparent 6px),repeating-linear-gradient(45deg,var(--tint) 0 12px,#C99A4A 12px 14px)}
.v-disc .lbl,.v-reel .lbl,.v-canvas .lbl,.v-frame .lbl,.v-clay .lbl,.v-vessel .lbl,.v-rug .lbl,.v-cushion .lbl{display:none}

/* glyphs: in clearings and, now and then, beside a card */
.gwrap{width:130px;height:130px}
.g-gap{margin-left:calc((100% - 130px) * var(--gf))}
.g-side{position:absolute;top:50%;margin-top:-65px;left:calc((100% - 130px) * var(--gf))}
@media (max-width: 1100px){.g-side{display:none}}
.glyph{display:block;overflow:visible}
.glyph g,.glyph circle,.glyph path{transform-box:view-box;transform-origin:60px 60px}
.boil{filter:url(#boil)}
.gwrap[data-off] *{animation-play-state:paused !important}
.gwrap[data-off] .glyph{filter:none !important}
.boil-hard{filter:url(#boilHard)}
.ln{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:3}
.inkf{fill:var(--ink)}
.gndf{fill:var(--ground)}
.wrapf{fill:var(--ground)}
.goldf{fill:#D6B25E}
.gold2{fill:#C9A04F}
.gold3{fill:#E3C47E}
.gl{fill:none;stroke:#D6B25E;stroke-width:1.5;stroke-linecap:round}
.crat{fill:none;stroke:#D6B25E;stroke-width:2.5}
.ring75{stroke-dasharray:141 48}
.allah{font-family:'Aref Ruqaa','Amiri',serif;font-weight:700;font-size:62px;fill:var(--ink);text-anchor:middle}
.clipP{clip-path:url(#planetClip)}
.clipM{clip-path:url(#mtnClip)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-fast{animation:spin 4s steps(24) infinite}
.orb1{animation:spin 3s steps(30) infinite}
.orb2{animation:spin 5s steps(30) infinite reverse}
.orb3{animation:spin 8s steps(40) infinite}
.slowspin{animation:spin 11s steps(22) infinite}
.spin-step{animation:spin 6s steps(10) infinite}
@keyframes drift{to{transform:translateX(-72px)}}
.drift{animation:drift 8s linear infinite}
.drift-slow{animation:drift 18s linear infinite}
@keyframes jit{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(1px,-1px) rotate(1.5deg)}40%{transform:translate(-1.5px,.5px) rotate(-1deg)}60%{transform:translate(.5px,1.5px) rotate(.5deg)}80%{transform:translate(-1px,-1px) rotate(-1.5deg)}}
.jit{animation:jit .5s steps(1) infinite}
@keyframes jith{0%{transform:translate(0,0) rotate(0)}17%{transform:translate(3px,-2px) rotate(6deg)}34%{transform:translate(-2px,2px) rotate(-4deg)}51%{transform:translate(2px,3px) rotate(9deg)}68%{transform:translate(-3px,-1px) rotate(-7deg)}85%{transform:translate(1px,-3px) rotate(3deg)}}
.jit-hard{animation:jith .7s steps(1) infinite}
@keyframes slow4{0%{transform:rotate(0) translate(0,0)}25%{transform:rotate(-5deg) translate(-1px,1px)}50%{transform:rotate(3deg) translate(1px,0)}75%{transform:rotate(-2deg) translate(0,-1px)}}
.slow4{animation:slow4 4s steps(1) infinite}
@keyframes buzz{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(1.6px,-1px) rotate(4deg)}50%{transform:translate(-1.4px,1.2px) rotate(-3deg)}75%{transform:translate(1px,1.6px) rotate(2deg)}}
.buzz{animation:buzz 1.6s steps(1) infinite}
@keyframes travel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(30px);opacity:1}78%{transform:translateY(30px);opacity:0}100%{transform:translateY(30px);opacity:0}}
.travel{animation:travel 2.4s steps(12) infinite}
@keyframes fr{0%{opacity:1}25%,100%{opacity:0}}
.fr{opacity:0;animation:fr 1.8s steps(1) infinite}
.fr2{animation-delay:.45s}.fr3{animation-delay:.9s}.fr4{animation-delay:1.35s}
.frw{opacity:0;animation:fr 1.6s steps(1) infinite}
.frw2{animation-delay:.4s}.frw3{animation-delay:.8s}.frw4{animation-delay:1.2s}
@keyframes rise{0%{transform:translateY(64px);animation-timing-function:steps(5)}22%{transform:translateY(0)}100%{transform:translateY(0)}}
.rise{animation:rise 3.4s infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.tw{animation:tw 1.2s steps(3) infinite}
@media (prefers-reduced-motion: reduce){.glyph,.glyph *{animation:none !important}.boil,.boil-hard{filter:none}.fr1,.frw1{opacity:1}}

.fld{border:1.5px solid #F4EBD6;background:transparent;color:#F4EBD6;border-radius:999px;padding:12px 18px;font-size:15px;min-height:44px;box-sizing:border-box;flex:1 1 220px;min-width:0}
.fld::placeholder{color:rgba(244,235,214,.7)}
.btn{border:none;background:#F4EBD6;color:#1E2B55;border-radius:999px;padding:12px 22px;font-size:15px;min-height:44px;cursor:pointer}
.foot{margin-top:120px;padding:44px 44px 36px;color:#F4EBD6;display:flex;flex-direction:column;gap:30px}
.fcall{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:27px;letter-spacing:-0.03em;color:#D6B25E;text-transform:lowercase;text-align:center;margin:0}
.flinks{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:-0.07em;text-transform:lowercase}
.flinks a{color:#E3C47E;text-underline-offset:4px}.flinks a:hover{color:#F4EBD6}
</style>
</head>

<div id="app"></div>
